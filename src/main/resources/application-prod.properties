# =============================================================
# Production Profile (Railway + Vercel)
# =============================================================

# 1. Server Port (Railway injects PORT)
server.port=${PORT:8080}

# 2. Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# 4. Security & Swagger
spring.h2.console.enabled=false
springdoc.swagger-ui.enabled=true

# 5. OAuth2 Configuration

# Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI}

# GitHub
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
spring.security.oauth2.client.registration.github.redirect-uri=${GITHUB_REDIRECT_URI}

# 6. JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# 7. Frontend (VERY IMPORTANT)
app.oauth2.redirect-uri=${FRONTEND_URL}
